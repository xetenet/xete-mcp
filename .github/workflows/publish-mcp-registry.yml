name: Publish to MCP Registry

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC; proves this repo belongs to the org
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json
        run: |
          python3 -c "import json;d=json.load(open('server.json'));print('name:',d['name']);print('version:',d['version'])"
          test "$(head -c 3 server.json | xxd -p)" != "efbbbf" || { echo "server.json has a UTF-8 BOM; the registry parser rejects it"; exit 1; }

      - name: Authenticate via OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
